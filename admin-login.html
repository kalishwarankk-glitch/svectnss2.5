<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Login — SVCET NSS</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="admin.css" />
</head>
<body>
<div class="admin-login-wrap">
  <form class="login-card" id="loginForm">
    <div style="text-align:center;display:flex;align-items:center;justify-content:center;gap:8px;font-family:'Fraunces',serif;font-size:1.15rem;color:var(--forest-dark);margin-bottom:6px;">
      <img src="logo.png" alt="SVCET NSS" style="height:34px;width:34px;border-radius:50%;object-fit:cover;" />
      NSS Admin
    </div>
    <p style="text-align:center;font-size:.78rem;color:rgba(22,34,28,.55);margin-bottom:18px;">Sign in with the official NSS admin account.</p>
    <div class="login-error" id="loginError"></div>
    <label>Email<input type="email" name="email" required placeholder="svcetnss26@gmail.com" /></label>
    <label>Password<input type="password" name="password" required placeholder="••••••••" /></label>
    <button type="submit" class="btn btn-primary">Sign in</button>
    <p style="text-align:center;margin-top:16px;"><a href="index.html" style="font-size:.8rem;color:var(--forest);">&larr; Back to site</a></p>
  </form>
</div>
<script src="admin-auth.js"></script>
<script>
  document.getElementById('loginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const ok = NSSAuth.login(fd.get('email'), fd.get('password'));
    const errEl = document.getElementById('loginError');
    if (ok) { window.location.href = 'dashboard.html'; }
    else { errEl.textContent = 'Invalid email or password.'; errEl.style.display = 'block'; }
  });
  if (NSSAuth.isLoggedIn()) window.location.href = 'dashboard.html';
</script>
</body>
</html>
