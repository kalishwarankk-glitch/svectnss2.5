<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Dashboard — SVCET NSS</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="admin.css" />
</head>
<body>
<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="side-brand"><img src="logo.png" alt="SVCET NSS" />NSS Admin</div>
    <button class="side-link" data-tab="dashboard">📊 Dashboard</button>
    <button class="side-link" data-tab="home">🏠 Home Page</button>
    <button class="side-link" data-tab="programs">🌿 Programs</button>
    <button class="side-link" data-tab="activities">📅 Activities</button>
    <button class="side-link" data-tab="team">👥 Staff &amp; Volunteers</button>
    <button class="side-link" data-tab="gallery">🖼️ Gallery Photos</button>
    <button class="side-link side-logout" id="logoutBtn">🚪 Log out</button>
  </aside>
  <main class="admin-main">
    <div id="tab-dashboard" class="admin-tab"></div>
    <div id="tab-home" class="admin-tab" style="display:none;"></div>
    <div id="tab-programs" class="admin-tab" style="display:none;"></div>
    <div id="tab-activities" class="admin-tab" style="display:none;"></div>
    <div id="tab-team" class="admin-tab" style="display:none;"></div>
    <div id="tab-gallery" class="admin-tab" style="display:none;"></div>
  </main>
</div>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal-box" id="modalBox"></div></div>
<script src="store.js"></script>
<script src="admin-auth.js"></script>
<script src="admin.js"></script>
</body>
</html>
